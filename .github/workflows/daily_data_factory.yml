name: Daily Data Factory

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Allows manual trigger

jobs:
  generate-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: json_cefr_evaluated_data  # Checkout to specific directory as requested

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: json_cefr_evaluated_data
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cd json_cefr_evaluated_data
          python main.py

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          cd json_cefr_evaluated_data
          python -c "
          from huggingface_hub import HfApi
          import os

          try:
              api = HfApi()
              token = os.getenv('HF_TOKEN')
              repo_id = os.getenv('HF_REPO_ID')

              if token and repo_id:
                  print(f'Uploading dataset to Hugging Face repo: {repo_id}...')
                  api.upload_file(
                      path_or_fileobj='data/english_cefr_dataset.jsonl',
                      path_in_repo='english_cefr_dataset.jsonl',
                      repo_id=repo_id,
                      repo_type='dataset',
                      token=token
                  )
                  print('Upload success!')
              else:
                  print('Warning: HF_REPO_ID or HF_TOKEN not set in Secrets. Skipping upload.')

          except Exception as e:
              print(f'Error uploading to HF: {e}')
          "

      - name: Commit and Push changes
        working-directory: json_cefr_evaluated_data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update synthetic dataset [skip ci]"
            git push
          fi
